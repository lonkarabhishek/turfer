<linearGradient id="turf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#14532D"/></linearGradient>
<radialGradient id="beam" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="#FFF3C4" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<polygon points="210,170 40,560 380,560" fill="url(#beam)"/>
<polygon points="990,170 820,560 1160,560" fill="url(#beam)"/>
