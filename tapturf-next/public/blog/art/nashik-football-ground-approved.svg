<g fill="#52525B"><rect x="204" y="190" width="12" height="260"/><rect x="984" y="190" width="12" height="260"/></g>
<g fill="#FFF3C4"><rect x="170" y="150" width="80" height="40" rx="6"/><rect x="950" y="150" width="80" height="40" rx="6"/></g>
<g fill="#0B0B0E" opacity="0.35"><circle cx="190" cy="170" r="6"/><circle cx="210" cy="170" r="6"/><circle cx="230" cy="170" r="6"/><circle cx="970" cy="170" r="6"/><circle cx="990" cy="170" r="6"/><circle cx="1010" cy="170" r="6"/></g>
<g font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF">
