<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t"><title id="t">Illustration of a floodlit football ground at night with two tall floodlight masts and a Nashik news label</title>
<defs>
