<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t"><title id="t">Two team cards from the TapTurf cricket team generator, Team 1 and Team 2 with five players each and 16 points each, next to three steps: paste names, pick teams and mode, generate and copy</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1F14"/><stop offset="1" stop-color="#123524"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF">
<text x="80" y="110" font-size="50" font-weight="700">Cricket team generator</text>
<text x="80" y="155" font-size="26" fill-opacity="0.7">Fair sides in 3 steps, random or balanced</text>
<g font-size="32" font-weight="700">
<rect x="80" y="220" width="540" height="100" rx="16" fill="#FFFFFF" fill-opacity="0.08"/><text x="110" y="283"><tspan fill="#4ADE80">1</tspan>  Paste the names</text>
<rect x="80" y="340" width="540" height="100" rx="16" fill="#FFFFFF" fill-opacity="0.08"/><text x="110" y="403"><tspan fill="#4ADE80">2</tspan>  Pick teams and mode</text>
<rect x="80" y="460" width="540" height="100" rx="16" fill="#FFFFFF" fill-opacity="0.08"/><text x="110" y="523"><tspan fill="#4ADE80">3</tspan>  Generate and copy</text>
</g>
<rect x="680" y="200" width="210" height="400" rx="20" fill="#111113"/>
<rect x="680" y="200" width="210" height="8" fill="#16A34A"/>
<text x="700" y="250" font-size="24" font-weight="800">Team 1</text>
<text x="870" y="250" font-size="14" text-anchor="end" fill-opacity="0.6">16 pts</text>
<g font-size="19"><text x="700" y="300">Rohan</text><text x="870" y="300" text-anchor="end" fill="#86EFAC">5</text>
<text x="700" y="345">Akash</text><text x="870" y="345" text-anchor="end" fill="#86EFAC">4</text>
<text x="700" y="390">Raj</text><text x="870" y="390" text-anchor="end" fill="#86EFAC">3</text>
<text x="700" y="435">Varun</text><text x="870" y="435" text-anchor="end" fill="#86EFAC">2</text>
<text x="700" y="480">Karan</text><text x="870" y="480" text-anchor="end" fill="#86EFAC">2</text></g>
<text x="700" y="570" font-size="14" fill-opacity="0.5">5 players</text>
<rect x="910" y="200" width="210" height="400" rx="20" fill="#111113"/>
<rect x="910" y="200" width="210" height="8" fill="#16A34A"/>
<text x="930" y="250" font-size="24" font-weight="800">Team 2</text>
<text x="1100" y="250" font-size="14" text-anchor="end" fill-opacity="0.6">16 pts</text>
<g font-size="19"><text x="930" y="300">Omkar</text><text x="1100" y="300" text-anchor="end" fill="#86EFAC">5</text>
<text x="930" y="345">Shreyas</text><text x="1100" y="345" text-anchor="end" fill="#86EFAC">4</text>
<text x="930" y="390">Sahil</text><text x="1100" y="390" text-anchor="end" fill="#86EFAC">3</text>
<text x="930" y="435">Aman</text><text x="1100" y="435" text-anchor="end" fill="#86EFAC">3</text>
<text x="930" y="480">Abhishek</text><text x="1100" y="480" text-anchor="end" fill="#86EFAC">1</text></g>
<text x="930" y="570" font-size="14" fill-opacity="0.5">5 players</text>
<text x="80" y="625" font-size="24" fill-opacity="0.7">tapturf.in/tools/cricket-team-generator</text>
</g>
</svg>
